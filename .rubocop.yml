plugins:
  - rubocop-rails
  - rubocop-rspec_rails
require:
  - rubocop-rails
  - rubocop-rspec_rails

Bundler/OrderedGems:
  Enabled: true

Metrics/BlockLength:
  Exclude: 
    - '**/*_spec.rb'
    - 'Guardfile'
    - '**/*.rake'
    - 'db/migrate/**'
    - 'config/**/*'

Metrics/MethodLength:
  Max: 25

Style/FrozenStringLiteralComment:
  Enabled: false

Style/Documentation:
  Enabled: false

Rails/NotNullColumn:
  Enabled: false

Rails/UniqueValidationWithoutIndex:
  Enabled: false

Naming/VariableNumber:
  Enabled: false
